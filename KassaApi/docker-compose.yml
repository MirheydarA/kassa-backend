services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kassa-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD .env-də təyin edilməlidir}"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kassa-backend
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=KassaDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD .env-də təyin edilməlidir};TrustServerCertificate=True;"
      Jwt__Key: "${JWT_KEY:?JWT_KEY .env-də təyin edilməlidir}"
      Jwt__Issuer: "KassaApi"
      Jwt__Audience: "KassaApiClient"
      Jwt__ExpiresMinutes: "480"
      AdminUser__Username: "${ADMIN_USERNAME:?ADMIN_USERNAME .env-də təyin edilməlidir}"
      AdminUser__Password: "${ADMIN_PASSWORD:?ADMIN_PASSWORD .env-də təyin edilməlidir}"
      Cors__AllowedOrigin: "${CORS_ALLOWED_ORIGIN:-http://localhost:5173}"
    ports:
      - "5000:8080"

volumes:
  sqlserver-data: